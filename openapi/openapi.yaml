info:
  title: MathsAlot Studio API
  description: Internal curriculum-authoring API. Authenticated Admin and Staff users only; learner accounts have no access.
  version: 0.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Short-lived HS256 access token from POST /api/auth/login.
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: admin@mathsalot.example
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 200
          writeOnly: true
      required:
        - email
        - password
    SessionUserDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: &ref_29
            - ADMIN
            - STAFF
            - LEARNER
        isAdmin:
          type: boolean
          description: True for Admin accounts, which bypass permission grants.
        permissions:
          description: Effective permission keys.
          type: array
          items:
            type: string
      required:
        - id
        - email
        - displayName
        - role
        - isAdmin
        - permissions
    AuthSessionDto:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived HS256 access token.
        refreshToken:
          type: string
          description: Opaque refresh token. Store server-side only.
          writeOnly: true
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: number
          description: Access token lifetime in seconds.
          example: 900
        user:
          $ref: '#/components/schemas/SessionUserDto'
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Opaque refresh token issued by login or refresh.
          writeOnly: true
      required:
        - refreshToken
    LogoutResponseDto:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
          example: true
      required:
        - success
    MeDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: *ref_29
        isAdmin:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required:
        - id
        - email
        - displayName
        - role
        - isAdmin
        - permissions
    UserSummaryDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: *ref_29
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        permissions:
          description: Granted permission keys.
          type: array
          items:
            type: string
      required:
        - id
        - email
        - displayName
        - role
        - createdAt
        - lastLoginAt
        - permissions
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        role:
          type: string
          enum:
            - ADMIN
            - STAFF
        password:
          type: string
          minLength: 12
          maxLength: 200
          writeOnly: true
      required:
        - email
        - displayName
        - role
        - password
    ResetUserPasswordDto:
      type: object
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 200
          writeOnly: true
      required:
        - password
    ResetPasswordResponseDto:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
          example: true
        revokedSessions:
          type: number
          description: Number of the target user’s sessions revoked.
      required:
        - success
        - revokedSessions
    UserPermissionDto:
      type: object
      properties:
        key:
          type: string
          example: trick.content.write
        label:
          type: string
          example: Write Trick wording, scenarios, and worked examples per age tier
        grantedAt:
          type: string
          format: date-time
      required:
        - key
        - label
        - grantedAt
    GrantPermissionDto:
      type: object
      properties:
        key:
          type: string
          example: trick.content.write
      required:
        - key
    RevokePermissionResponseDto:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
          example: true
        removed:
          type: boolean
          description: True when a grant existed and was removed.
      required:
        - success
        - removed
    PermissionDto:
      type: object
      properties:
        key:
          type: string
          example: trick.content.write
        label:
          type: string
          example: Write Trick wording, scenarios, and worked examples per age tier
      required:
        - key
        - label
    WorldRollupDto:
      type: object
      properties:
        trickCount:
          type: number
        completeTrickCount:
          type: number
        readyTrickCount:
          type: number
        completionPercent:
          type: number
          minimum: 0
          maximum: 100
      required:
        - trickCount
        - completeTrickCount
        - readyTrickCount
        - completionPercent
    CompletenessDto:
      type: object
      properties:
        variantCount:
          type: number
          minimum: 0
          maximum: 3
        totalTiers:
          type: number
          example: 3
        missingTiers:
          type: array
          items:
            type: string
            enum: &ref_30
              - FORMATIVE
              - MIDRANGE
              - MATURE
        isComplete:
          type: boolean
        isReady:
          type: boolean
          description: Complete, verified, approved, and all variants approved.
      required:
        - variantCount
        - totalTiers
        - missingTiers
        - isComplete
        - isReady
    TrickSummaryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: &ref_31
            - STANDARD
            - CAPSTONE
        position:
          type: number
        completeness:
          $ref: '#/components/schemas/CompletenessDto'
      required:
        - id
        - name
        - kind
        - position
        - completeness
    WorldSummaryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        order:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rollup:
          $ref: '#/components/schemas/WorldRollupDto'
        tricks:
          type: array
          items:
            $ref: '#/components/schemas/TrickSummaryDto'
      required:
        - id
        - name
        - description
        - order
        - createdAt
        - updatedAt
        - rollup
        - tricks
    CreateWorldDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
      required:
        - name
    ReorderDto:
      type: object
      properties:
        orderedIds:
          description: Every current member id, in the desired 1..n order.
          type: array
          items:
            type: string
      required:
        - orderedIds
    ReorderResponseDto:
      type: object
      properties:
        orderedIds:
          type: array
          items:
            type: string
      required:
        - orderedIds
    UpdateWorldDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
    VariantDto:
      type: object
      properties:
        id:
          type: string
        ageTier:
          type: string
          enum: *ref_30
        wording:
          type: string
        scenario:
          type: string
        readingLevel:
          type: string
          nullable: true
        draftSource:
          type: string
          enum: &ref_32
            - HUMAN
            - AI
        reviewStatus:
          type: string
          enum: &ref_33
            - NEEDS_REVIEW
            - APPROVED
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - ageTier
        - wording
        - scenario
        - readingLevel
        - draftSource
        - reviewStatus
        - updatedAt
    TrickDetailDto:
      type: object
      properties:
        id:
          type: string
        worldId:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: *ref_31
        position:
          type: number
        methodDescription:
          type: string
        workedExample:
          type: string
          nullable: true
        vettingStatus:
          type: string
          enum: &ref_37
            - DRAFT
            - UNDER_REVIEW
            - VERIFIED
            - NEEDS_REVISION
        vettingValidity:
          type: string
          nullable: true
          description: Required before VERIFIED (D-041).
        vettingDomain:
          type: string
          nullable: true
          description: Required before VERIFIED (D-041).
        vettingEdgeCases:
          type: string
          nullable: true
          description: Required before VERIFIED (D-041).
        draftSource:
          type: string
          enum: *ref_32
        reviewStatus:
          type: string
          enum: *ref_33
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantDto'
        completeness:
          $ref: '#/components/schemas/CompletenessDto'
      required:
        - id
        - worldId
        - name
        - kind
        - position
        - methodDescription
        - workedExample
        - vettingStatus
        - vettingValidity
        - vettingDomain
        - vettingEdgeCases
        - draftSource
        - reviewStatus
        - publishedAt
        - createdAt
        - updatedAt
        - variants
        - completeness
    UpdateTrickDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum: *ref_31
        methodDescription:
          type: string
          minLength: 1
          maxLength: 8000
        workedExample:
          type: string
          nullable: true
          maxLength: 8000
    UpsertVariantDto:
      type: object
      properties:
        wording:
          type: string
          minLength: 1
          maxLength: 8000
        scenario:
          type: string
          minLength: 1
          maxLength: 8000
        readingLevel:
          type: string
          nullable: true
          maxLength: 200
        draftSource:
          type: string
          enum: *ref_32
          description: AI drafts default to NEEDS_REVIEW and stay blocked until approved (D-042).
      required:
        - wording
        - scenario
    PreviewDto:
      type: object
      properties:
        trickId:
          type: string
        ageTier:
          type: string
          enum: *ref_30
        wording:
          type: string
        scenario:
          type: string
        readingLevel:
          type: string
          nullable: true
      required:
        - trickId
        - ageTier
        - wording
        - scenario
        - readingLevel
    TrickVersionDto:
      type: object
      properties:
        id:
          type: string
        trickId:
          type: string
        editedById:
          type: string
        editedAt:
          type: string
          format: date-time
        snapshot:
          type: object
          additionalProperties: true
          description: Full Trick snapshot captured at this revision.
      required:
        - id
        - trickId
        - editedById
        - editedAt
        - snapshot
    CreateTrickDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum: *ref_31
          default: STANDARD
        methodDescription:
          type: string
          minLength: 1
          maxLength: 8000
        workedExample:
          type: string
          nullable: true
          maxLength: 8000
        draftSource:
          type: string
          enum: *ref_32
          default: HUMAN
          description: AI drafts default to NEEDS_REVIEW and stay blocked until approved (D-042).
      required:
        - name
        - methodDescription
    CurriculumCompletionDto:
      type: object
      properties:
        sequenceCount:
          type: number
        completeSequenceCount:
          type: number
        assignmentCount:
          type: number
        coveredTrickCount:
          type: number
        introduceCount:
          type: number
        retainCount:
          type: number
        revisitCount:
          type: number
        completionPercent:
          type: number
          minimum: 0
          maximum: 100
      required:
        - sequenceCount
        - completeSequenceCount
        - assignmentCount
        - coveredTrickCount
        - introduceCount
        - retainCount
        - revisitCount
        - completionPercent
    CurriculumSummaryDto:
      type: object
      properties:
        id:
          type: string
        worldId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: string
        status:
          type: string
          enum: &ref_34
            - DRAFT
            - ACTIVE
            - ARCHIVED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completion:
          $ref: '#/components/schemas/CurriculumCompletionDto'
      required:
        - id
        - worldId
        - name
        - description
        - version
        - status
        - createdAt
        - updatedAt
        - completion
    CreateCurriculumDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        version:
          type: string
          minLength: 1
          maxLength: 50
          description: Version label, e.g. "v1".
        status:
          type: string
          enum: *ref_34
          default: DRAFT
      required:
        - name
        - version
    SequenceCompletionDto:
      type: object
      properties:
        assignmentCount:
          type: number
        introduceCount:
          type: number
        retainCount:
          type: number
        revisitCount:
          type: number
